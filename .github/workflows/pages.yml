# Builds public/ (website at /, Client/Pro/Admin at /app/) and deploys it to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/cool-einstein-32rfsv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        run: python3 build.py
      - name: Smoke test
        run: |
          pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
          python3 platform/tests/check_portals.py
          python3 platform/tests/e2e_site_links.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

/* listd components. Every value comes from tokens.css; component-only values are noted. */
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; font-synthesis: none; }
.ld-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-4); }
.ld-stack { display: grid; gap: var(--space-4); padding: var(--space-4); align-items: start; }
.ld-num { font-variant-numeric: tabular-nums; }
.ld-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:where(.ld-btn, .ld-iconbtn, .ld-link, .ld-input, .ld-select, .ld-check input, .ld-radio input, .ld-switch input, .ld-tab, .ld-page, .ld-card-i):focus-visible { outline: var(--stroke-strong) solid var(--focus-ring); outline-offset: 2px; }

/* Logo */
.ld-logo { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.055em; line-height: 1; color: var(--brand); text-transform: lowercase; display: inline-block; }
.ld-logo-white { color: #FFFFFF; } /* white wordmark is a fixed brand colour */
.ld-logo-ink { color: var(--text); }
.ld-logo .ld-logo-pro { color: var(--text); }

/* Icon */
.ld-icon { display: inline-block; flex: none; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Button */
.ld-btn { --h: var(--control-md); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--h); padding: 0 var(--space-4); border-radius: var(--radius-md); border: var(--stroke-hairline) solid transparent; font: 600 15px/20px var(--font-sans); letter-spacing: -0.005em; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
.ld-btn-sm { --h: var(--control-sm); padding: 0 var(--space-3); font-size: 13px; border-radius: var(--radius-sm); }
.ld-btn-lg { --h: var(--control-lg); padding: 0 var(--space-6); font-size: 16px; }
.ld-btn-full { width: 100%; }
.ld-btn-primary { background: var(--brand); color: var(--on-brand); }
.ld-btn-primary:hover { background: var(--brand-hover); }
.ld-btn-primary:active { background: var(--brand-pressed); }
.ld-btn-accent { background: var(--accent); color: var(--on-accent); }
.ld-btn-accent:hover { box-shadow: inset 0 0 0 999px rgba(10,35,38,0.08); }
.ld-btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.ld-btn-secondary:hover { background: var(--surface-sunken); }
.ld-btn-ghost { background: transparent; color: var(--brand-text); }
.ld-btn-ghost:hover { background: var(--brand-subtle); }
.ld-btn-danger { background: var(--danger-subtle); color: var(--danger); border-color: var(--danger); }
.ld-btn-danger:hover { background: var(--surface); }
.ld-btn:disabled, .ld-btn[aria-disabled="true"] { opacity: var(--opacity-disabled); cursor: not-allowed; }
.ld-spin { width: 1em; height: 1em; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: ld-rot .8s linear infinite; display: inline-block; flex: none; }
@keyframes ld-rot { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ld-spin, .ld-skel { animation: none !important; } .ld-btn, .ld-switch span, .ld-toast { transition: none !important; } }

/* IconButton */
.ld-iconbtn { width: var(--control-md); height: var(--control-md); display: inline-grid; place-items: center; border-radius: var(--radius-md); border: var(--stroke-hairline) solid transparent; background: transparent; color: var(--text); cursor: pointer; }
.ld-iconbtn:hover { background: var(--surface-sunken); }
.ld-iconbtn-sm { width: var(--control-sm); height: var(--control-sm); border-radius: var(--radius-sm); }
.ld-iconbtn-secondary { border-color: var(--border-strong); background: var(--surface); }
.ld-iconbtn-primary { background: var(--brand); color: var(--on-brand); }
.ld-iconbtn-primary:hover { background: var(--brand-hover); }

/* Link */
.ld-link { color: var(--link); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; display: inline-flex; align-items: center; gap: var(--space-1); }
.ld-link:hover { color: var(--brand-hover); }

/* Fields */
.ld-field { display: grid; gap: var(--space-1\.5); min-width: 0; align-content: start; }
.ld-label { font: 600 14px/20px var(--font-sans); color: var(--text); }
.ld-label small { font-weight: 400; color: var(--text-muted); margin-left: var(--space-1); }
.ld-hint { font-size: 13px; line-height: 18px; color: var(--text-muted); }
.ld-error { font-size: 13px; line-height: 18px; color: var(--danger); display: flex; gap: var(--space-1); align-items: center; font-weight: 600; }
.ld-control { min-width: 0; display: flex; align-items: center; gap: var(--space-2); height: var(--control-md); padding: 0 var(--space-3); border-radius: var(--radius-md); border: var(--stroke-hairline) solid var(--border-strong); background: var(--surface); color: var(--text-muted); }
.ld-control:focus-within { border-color: var(--focus-ring); box-shadow: 0 0 0 1px var(--focus-ring); }
.ld-control.is-invalid { border-color: var(--danger); }
.ld-control.is-disabled { background: var(--surface-sunken); opacity: var(--opacity-disabled); }
.ld-input, .ld-select { flex: 1 1 0; width: 0; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: 400 16px/24px var(--font-sans); padding: 0; }
.ld-input::placeholder, textarea.ld-input::placeholder { color: var(--text-subtle); }
.ld-control-area { height: auto; padding: var(--space-2) var(--space-3); align-items: stretch; }
textarea.ld-input { resize: vertical; min-height: 96px; }
.ld-select { appearance: none; cursor: pointer; }
.ld-control .ld-affix { color: var(--text-muted); font-size: 15px; }

/* Checkbox & radio */
.ld-check, .ld-radio { display: grid; grid-template-columns: 20px 1fr; gap: var(--space-1) var(--space-3); align-items: start; cursor: pointer; font-size: 15px; line-height: 22px; color: var(--text); }
.ld-check input, .ld-radio input { appearance: none; width: 20px; height: 20px; margin: 1px 0 0; border: var(--stroke-strong) solid var(--border-strong); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.ld-check input { border-radius: var(--radius-xs); }
.ld-radio input { border-radius: var(--radius-pill); }
.ld-check input:checked { background: var(--brand); border-color: var(--brand); }
.ld-check input:checked::after { content: ""; width: 10px; height: 6px; border: 2px solid var(--on-brand); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.ld-radio input:checked { border-color: var(--brand); }
.ld-radio input:checked::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
.ld-check small, .ld-radio small { grid-column: 2; color: var(--text-muted); font-size: 13px; line-height: 18px; }
.ld-radiogroup { border: 0; margin: 0; padding: 0; display: grid; gap: var(--space-3); }
.ld-radiogroup legend { font: 600 14px/20px var(--font-sans); margin-bottom: var(--space-2); padding: 0; }

/* Switch */
.ld-switch { display: inline-flex; align-items: center; gap: var(--space-3); cursor: pointer; font-size: 15px; color: var(--text); }
.ld-switch input { position: absolute; opacity: 0; width: 44px; height: 26px; margin: 0; cursor: pointer; }
.ld-switch span.t { position: relative; width: 44px; height: 26px; border-radius: var(--radius-pill); background: var(--border-strong); transition: background-color .15s ease; flex: none; }
.ld-switch span.t::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform .15s ease; }
.ld-switch input:checked + span.t { background: var(--brand); }
.ld-switch input:checked + span.t::after { transform: translateX(18px); }
.ld-switch input:focus-visible + span.t { outline: var(--stroke-strong) solid var(--focus-ring); outline-offset: 2px; }

/* Badge, pills, tags */
.ld-badge { display: inline-flex; align-items: center; gap: var(--space-1); height: 24px; padding: 0 var(--space-2); border-radius: var(--radius-pill); font: 600 12.5px/1 var(--font-sans); background: var(--surface-sunken); color: var(--text); white-space: nowrap; }
.ld-badge-brand { background: var(--brand-subtle); color: var(--brand-text); }
.ld-badge-success { background: var(--success-subtle); color: var(--success); }
.ld-badge-warning { background: var(--warning-subtle); color: var(--warning); }
.ld-badge-danger { background: var(--danger-subtle); color: var(--danger); }
.ld-badge-info { background: var(--info-subtle); color: var(--info); }
.ld-badge-solid { background: var(--brand); color: var(--on-brand); }
.ld-pill { display: inline-flex; align-items: center; gap: var(--space-1\.5); height: 28px; padding: 0 var(--space-3) 0 var(--space-2); border-radius: var(--radius-pill); font: 600 13.5px/1 var(--font-sans); background: var(--surface-sunken); color: var(--text); white-space: nowrap; }
.ld-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.ld-tag { display: inline-flex; align-items: center; gap: var(--space-1\.5); height: 28px; padding: 0 10px 0 var(--space-2); border-radius: var(--radius-sm); font: 700 13px/1 var(--font-sans); background: var(--t); color: var(--tx); white-space: nowrap; }
.ld-tag-solid { background: var(--c); color: var(--on-accent); }
.ld-tier { display: inline-flex; align-items: center; gap: var(--space-2); height: 28px; padding: 0 var(--space-3); border-radius: var(--radius-pill); font: 700 13px/1 var(--font-sans); white-space: nowrap; }
.ld-tier b { font-weight: 500; opacity: .85; font-variant-numeric: tabular-nums; }
.ld-tier-flex { background: var(--service-inventory-subtle); color: var(--service-inventory-text); }
.ld-tier-core { background: var(--brand); color: var(--on-brand); }
.ld-tier-priority { background: var(--surface-inverse); color: var(--text-inverse); }
.ld-tier-priority::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--live); }

/* Avatar & level */
.ld-avatar { overflow: visible !important; position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--brand-subtle); color: var(--brand-text); font: 700 14px/1 var(--font-sans); flex: none; overflow: hidden; }
.ld-avatar img { border-radius: inherit; width: 100%; height: 100%; object-fit: cover; }
.ld-avatar-sm { width: 32px; height: 32px; border-radius: var(--radius-sm); font-size: 12px; }
.ld-avatar-lg { width: 56px; height: 56px; border-radius: 16px; font-size: 18px; }
.ld-avatar .v { position: absolute; right: -3px; bottom: -3px; width: 15px; height: 15px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); display: grid; place-items: center; color: var(--on-accent); }
.ld-level { display: inline-flex; align-items: center; gap: var(--space-2); font-size: 13px; color: var(--text-muted); }
.ld-level span { display: inline-flex; gap: 3px; }
.ld-level i { width: 18px; height: 6px; border-radius: var(--radius-pill); background: var(--border); }
.ld-level i.on { background: var(--brand); }

/* Card */
.ld-card { background: var(--surface); border: var(--stroke-hairline) solid var(--border); border-radius: var(--radius-lg); padding: var(--space-6); display: grid; gap: var(--space-3); min-width: 0; color: var(--text); }
.ld-card-i { cursor: pointer; transition: box-shadow .15s ease, border-color .15s ease; text-align: left; font: inherit; }
.ld-card-i:hover { box-shadow: var(--shadow-sm); border-color: var(--border-strong); }
.ld-card-sel { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.ld-eyebrow { font: 700 11px/14px var(--font-label); letter-spacing: .16em; text-transform: uppercase; color: var(--brand-text); }
.ld-card h3 { margin: 0; font: 700 20px/28px var(--font-sans); letter-spacing: -0.015em; }
.ld-card-body { color: var(--text-muted); font-size: 15px; line-height: 23px; }
.ld-card-foot { display: flex; gap: var(--space-2); align-items: center; justify-content: space-between; flex-wrap: wrap; border-top: var(--stroke-hairline) solid var(--border); padding-top: var(--space-3); margin-top: var(--space-1); }

/* Job card */
.ld-job { position: relative; overflow: hidden; padding-top: calc(var(--space-6) + 6px); }
.ld-job::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--c); }
.ld-job-top { display: flex; justify-content: space-between; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.ld-job h3 { font-size: 18px; line-height: 24px; }
.ld-job-meta { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); font-size: 14px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.ld-job-meta span { display: inline-flex; gap: var(--space-1\.5); align-items: center; }
.ld-job-pro { display: flex; align-items: center; gap: var(--space-3); font-size: 14px; }
.ld-job-pro b { display: block; font-weight: 600; color: var(--text); }

/* Progress rail */

/* Condition rating */

.ld-condset { display: inline-flex; flex-wrap: wrap; gap: var(--space-1\.5); border: 0; padding: 0; margin: 0; }
.ld-condset button { font: inherit; cursor: pointer; border: var(--stroke-hairline) solid var(--border-strong); background: var(--surface); }

/* Evidence photo */

.ld-evid::before { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: var(--radius-sm); }
.ld-evid::after { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: var(--radius-sm); }
.ld-evid-img { position: relative; aspect-ratio: 4/3; border-radius: var(--radius-md); overflow: hidden; background: linear-gradient(180deg, var(--sky-100) 0 58%, var(--amber-300) 58% 100%); }

.ld-evid-stamp { position: absolute; left: var(--space-3); top: var(--space-3); display: inline-flex; gap: var(--space-2); align-items: center; padding: 6px 10px; border-radius: var(--radius-sm); background: var(--neutral-900); color: #FFFFFF; font: 600 12px/1.2 var(--font-sans); font-variant-numeric: tabular-nums; } /* stamp stays dark on any photo */
.ld-evid-stamp i { width: 8px; height: 8px; border-radius: 50%; background: var(--live); }
.ld-evid-flag { position: absolute; width: 40px; height: 40px; border: var(--stroke-strong) dashed var(--danger-fill); border-radius: 50%; }
.ld-evid figcaption { font-size: 13px; line-height: 18px; color: var(--text-muted); margin-top: var(--space-2); }

/* Tabs */
.ld-tabs { display: flex; gap: var(--space-1); border-bottom: var(--stroke-hairline) solid var(--border); overflow-x: auto; }
.ld-tab { position: relative; display: inline-flex; gap: var(--space-2); align-items: center; height: 44px; padding: 0 var(--space-3); background: none; border: 0; cursor: pointer; font: 600 15px/1 var(--font-sans); color: var(--text-muted); white-space: nowrap; }
.ld-tab:hover { color: var(--text); }
.ld-tab[aria-selected="true"] { color: var(--brand-text); }
.ld-tab[aria-selected="true"]::after { content: ""; position: absolute; left: var(--space-2); right: var(--space-2); bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--brand); }

/* Navbar */
.ld-nav { display: flex; align-items: center; gap: var(--space-6); padding: 0 var(--space-6); height: 64px; background: var(--surface); border-bottom: var(--stroke-hairline) solid var(--border); }

.ld-nav-links a { padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); color: var(--text-muted); text-decoration: none; font: 600 14.5px/1 var(--font-sans); white-space: nowrap; }
.ld-nav-links a:hover { color: var(--text); background: var(--surface-sunken); }

/* Breadcrumbs, pagination */

.ld-page { min-width: 36px; height: 36px; padding: 0 var(--space-2); border-radius: var(--radius-sm); border: 0; background: none; font: 600 14px/1 var(--font-sans); color: var(--text); cursor: pointer; font-variant-numeric: tabular-nums; display: inline-grid; place-items: center; }
.ld-page:hover { background: var(--surface-sunken); }

/* Alert & toast */
.ld-alert { display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-3); align-items: start; padding: var(--space-4); border-radius: var(--radius-lg); background: var(--t); color: var(--text); border: var(--stroke-hairline) solid var(--c); }

/* Progress, spinner, skeleton */

.ld-skel { display: block; border-radius: var(--radius-sm); background: linear-gradient(90deg, var(--surface-sunken) 0%, var(--border) 50%, var(--surface-sunken) 100%); background-size: 200% 100%; animation: ld-shim 1.4s ease-in-out infinite; }

/* Table */
.ld-tablewrap { overflow-x: auto; border: var(--stroke-hairline) solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }

/* Service tile */

[hidden] { display: none !important; }
/* listd platform app. Layout: app shell with role bar, side nav (desktop) / bottom tabs (phone), content column. Built on listd Design System tokens + bundle.css. */

/* top bar */

.a-roles { display: inline-flex; background: var(--surface-sunken); border-radius: 12px; padding: 3px; gap: 2px; margin-left: auto; }
.a-roles button { border: 0; background: none; height: 34px; padding: 0 12px; border-radius: 9px; font: 600 14px/1 var(--font-sans); color: var(--text-muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.a-roles button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-xs); }
.a-acct { display: flex; align-items: center; gap: 8px; min-width: 0; }
.a-acct select { max-width: 180px; height: 34px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 500 14px var(--font-sans); padding: 0 8px; }
@media (max-width: 760px) { .a-top .tag, .a-acct .lbl { display: none; } .a-top .in { gap: 10px; } .a-roles button span { display: none; } .a-roles button { padding: 0 10px; } }

.a-mode { font-size: 12.5px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); background: var(--warning-subtle); color: var(--warning); text-align: center; }

/* layout */

.a-tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; background: var(--surface); border-top: 1px solid var(--border); padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }

.a-main { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 110px max(16px, env(safe-area-inset-left, 0px)); min-width: 0; }

.a-page { max-width: 1080px; margin: 0 auto; display: grid; gap: 24px; }
.a-head { display: flex; flex-wrap: wrap; gap: 12px 16px; justify-content: space-between; align-items: end; }
.a-head h1 { font: 400 clamp(26px, 3.4vw, 34px)/1.15 var(--font-display); letter-spacing: -0.02em; }

.a-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }

.a-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; display: grid; gap: 12px; min-width: 0; }
.a-card.click { cursor: pointer; text-align: left; font: inherit; color: inherit; transition: box-shadow .15s ease, border-color .15s ease, transform .15s ease; }
.a-card.click:hover { box-shadow: var(--shadow-sm); border-color: var(--border-strong); transform: translateY(-1px); }

.a-stat .k { font: 700 11px/14px var(--font-label); letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
.a-empty { border: 1px dashed var(--border-strong); border-radius: 18px; padding: 36px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; background: var(--surface); }

.a-job { display: grid; grid-template-columns: 6px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px 14px 0; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; overflow: hidden; transition: box-shadow .15s ease, transform .15s ease; }
.a-job:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.a-job .bar { align-self: stretch; background: var(--c); margin: -14px 0; }
.a-job .t { display: grid; gap: 4px; min-width: 0; }
.a-job .t b { font-size: 15.5px; overflow-wrap: anywhere; }
.a-job .t span { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.a-job .r { display: grid; gap: 6px; justify-items: end; text-align: right; }
.a-job .r .price { font-weight: 700; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .a-job { grid-template-columns: 6px 1fr; } .a-job .r { grid-column: 2; justify-items: start; text-align: left; } }

/* timeline */
.a-tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-left: 2px solid var(--border); margin-left: 6px; }
.a-tl li { position: relative; padding: 0 0 14px 18px; font-size: 14px; }
.a-tl li::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--brand)); border: 2px solid var(--surface); }
.a-tl li span { display: block; font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* report */
.a-room { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); overflow: hidden; }
.a-room > header { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 12px 16px; background: var(--surface-sunken); font-weight: 700; flex-wrap: wrap; }
.a-room .body { padding: 14px 16px; display: grid; gap: 12px; }
.a-item { display: grid; grid-template-columns: minmax(120px, 1fr) auto; gap: 8px 12px; align-items: center; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
.a-item:last-child { border-bottom: 0; padding-bottom: 0; }
.a-item .nm { font-weight: 600; font-size: 14.5px; }
.a-item .note { grid-column: 1 / -1; }
.a-item .cmp { grid-column: 1 / -1; font-size: 12.5px; color: var(--text-muted); }
.a-item .cmp.worse { color: var(--danger); font-weight: 600; }
.a-conds { display: flex; flex-wrap: wrap; gap: 4px; }
.a-conds button { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 600 12.5px var(--font-sans); cursor: pointer; }
.a-conds button[aria-pressed="true"] { background: var(--t); border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.a-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.a-ph { position: relative; aspect-ratio: 4/3; border-radius: 10px; overflow: hidden; background: var(--surface-sunken); margin: 0; }
.a-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.a-ph figcaption { position: absolute; left: 4px; right: 4px; bottom: 4px; background: rgba(10,35,38,.82); color: #fff; font: 600 10px/1.3 var(--font-sans); padding: 3px 6px; border-radius: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-ph .ph { position: absolute; top: 4px; left: 4px; background: var(--live); color: var(--on-live); font: 700 9.5px/1 var(--font-sans); padding: 3px 5px; border-radius: 5px; text-transform: uppercase; letter-spacing: .06em; }
.a-up { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px dashed var(--border-strong); background: var(--surface); color: var(--text); font: 600 13.5px var(--font-sans); cursor: pointer; }
.a-up input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.a-up:focus-within { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.a-ck { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.a-ck:last-child { border-bottom: 0; }
.a-ck input { width: 20px; height: 20px; accent-color: var(--brand); margin: 1px 0 0; flex: none; }
.a-stars { display: inline-flex; gap: 4px; }
.a-stars button { border: 0; background: none; padding: 2px; cursor: pointer; color: var(--border-strong); font-size: 0; }
.a-stars button[aria-pressed="true"] { color: var(--live); }
.a-stars svg { width: 28px; height: 28px; fill: currentColor; stroke: none; }

/* tables */
.a-tw { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
.a-tw table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
.a-tw th { text-align: left; font: 700 10.5px/14px var(--font-label); letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); background: var(--surface-sunken); padding: 10px 14px; white-space: nowrap; }
.a-tw td { padding: 11px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
.a-tw tr.click { cursor: pointer; }
.a-tw tr.click:hover td { background: var(--brand-subtle); }
.a-tw .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.a-filter { display: flex; flex-wrap: wrap; gap: 6px; }
.a-filter button { height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 600 13px var(--font-sans); cursor: pointer; }
.a-filter button[aria-pressed="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }
.a-bars { display: grid; gap: 8px; }
.a-bars .b { display: grid; grid-template-columns: 140px 1fr 36px; gap: 10px; align-items: center; font-size: 13.5px; }
.a-bars .b i { display: block; height: 10px; border-radius: 99px; background: var(--c, var(--brand)); min-width: 2px; }
.a-bars .b span:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* overlay modal */
.a-scrim { position: fixed; inset: 0; background: rgba(6,23,25,.55); z-index: 90; display: grid; place-items: center; padding: 16px; }
.a-modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface-raised); border-radius: 22px; box-shadow: var(--shadow-lg); padding: 24px; display: grid; gap: 16px; }
.a-modal h2 { font: 400 26px/1.2 var(--font-display); letter-spacing: -0.02em; }
.a-toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 95; background: var(--surface-inverse); color: var(--text-inverse); padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow-md); max-width: calc(100% - 32px); }
@media (min-width: 980px) { .a-toast { bottom: 24px; } }
.a-banner { border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; background: var(--t, var(--info-subtle)); border: 1px solid var(--c, var(--info)); }
.a-banner .ld-icon { color: var(--c, var(--info)); flex: none; margin-top: 2px; }
.a-banner b { display: block; }
.a-banner p { font-size: 14px; color: var(--text-muted); }
.a-big { display: grid; gap: 18px; }
@media (min-width: 900px) { .a-big { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; } }
.a-sticky { display: grid; gap: 16px; }
@media (min-width: 900px) { .a-sticky { position: sticky; top: 84px; } }

.a-bars .b .tr { display: block; background: var(--surface-sunken); border-radius: 99px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.a-item .a-conds { justify-self: end; }
@media (max-width: 560px) { .a-item { grid-template-columns: minmax(0,1fr); } .a-item .a-conds { justify-self: start; } .a-bars .b { grid-template-columns: 110px 1fr 28px; } }
/* v2 additions */
.a-shell.solo { grid-template-columns: minmax(0, 1fr) !important; }
.a-bell { position: relative; border: 0; background: none; color: var(--text); width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; }
.a-bell:hover { background: var(--surface-sunken); }
.a-bell span { position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--danger-fill, #e5484d); color: #fff; font: 700 11px/18px var(--font-sans); }
.a-who { font: 600 14px var(--font-sans); color: var(--text); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 760px) { .a-who { display: none; } }
.a-more { position: fixed; right: 8px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 45; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 8px; display: grid; gap: 2px; min-width: 220px; max-height: 70vh; overflow: auto; }
.a-note-row { display: flex; gap: 12px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border); background: none; padding: 14px 18px; cursor: pointer; color: var(--text); font: 500 14.5px/1.4 var(--font-sans); align-items: flex-start; }
.a-note-row:last-child { border-bottom: 0; }
.a-note-row.unread { background: var(--brand-subtle); font-weight: 600; }
.a-note-row i { width: 8px; height: 8px; border-radius: 99px; background: var(--brand); margin-top: 7px; flex: none; }
.a-note-row small { display: block; color: var(--text-muted); font-weight: 500; font-size: 12.5px; margin-top: 2px; }
.a-msgs { display: grid; gap: 10px; max-height: 360px; overflow: auto; padding: 4px; }
.a-msg { background: var(--surface-sunken); border-radius: 14px 14px 14px 4px; padding: 10px 12px; max-width: 85%; }
.a-msg.me { background: var(--brand-subtle); justify-self: end; border-radius: 14px 14px 4px 14px; }
.a-msg b { font-size: 13px; } .a-msg p { margin: 2px 0; font-size: 14.5px; white-space: pre-wrap; } .a-msg span { font-size: 12px; color: var(--text-muted); }
.a-mini { height: 36px; border: 1px solid var(--border-strong); border-radius: 9px; padding: 0 10px; background: var(--surface); color: var(--text); font: 500 14px var(--font-sans); max-width: 100%; }
.a-mini:focus-visible, .a-note:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
.a-note { height: 36px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; width: 100%; background: var(--surface); color: var(--text); font: 400 14px var(--font-sans); }
.a-chipbtn { height: 28px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 600 12px var(--font-sans); cursor: pointer; }
.a-chipbtn[aria-pressed="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }
.a-ph.pdf { display: grid; place-items: center; gap: 6px; padding: 16px; background: var(--surface-sunken); border-radius: 12px; color: var(--text); text-decoration: none; }
.a-queue { text-align: left; border: 1px solid var(--border); cursor: pointer; font: inherit; color: inherit; }
details.a-card > summary { cursor: pointer; list-style: revert; }
.a-main h1:focus { outline: none; }
.a-tw td .a-mini { width: 100%; }
details.a-room > summary { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 16px; background: var(--surface-sunken); font-weight: 700; cursor: pointer; list-style: none; }
details.a-room > summary::-webkit-details-marker { display: none; }
details.a-room > summary::before { content: "▸"; margin-right: 6px; transition: transform .15s; }
details.a-room[open] > summary::before { transform: rotate(90deg); }
details.a-room > summary > span:first-child { flex: 1; }
.a-icard { border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: grid; gap: 10px; background: var(--surface); }
.a-icard.pending { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-subtle); }
.a-aidraft { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--brand-subtle); color: var(--text); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.a-aidraft p { margin: 2px 0 0; color: var(--text-muted); } .a-aidraft b { color: var(--brand-text); }
.a-vetted { color: var(--success); display: inline-flex; gap: 4px; align-items: center; }
.a-ta { height: auto; min-height: 60px; padding: 8px 10px; resize: vertical; line-height: 1.45; }
.a-g4 { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.a-cmp { font-size: 12.5px; color: var(--text-muted); margin: 0; }
.a-spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--brand-subtle); border-top-color: var(--brand); border-radius: 99px; animation: aspin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes aspin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .a-spin { animation: none; } }
.a-conds button[aria-pressed="true"] { background: var(--brand-subtle); border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.a-note, .a-mini { box-sizing: border-box; }
.a-rpt { display: grid; gap: 0; }
.a-rpt .bar { background: #68CD9A; color: #fff; font: 700 12.5px/1 var(--font-sans); letter-spacing: .02em; padding: 10px 12px; margin-top: 16px; text-transform: none; }
.a-rpt .pad { padding: 10px 12px; }
.a-rpt .a-tw { border-radius: 0; margin: 0; }
.a-rpt table thead th { background: #68CD9A; color: #fff; text-transform: none; letter-spacing: 0; font-size: 13px; }
.a-rpt td.ref { font-weight: 700; font-size: 11.5px; white-space: nowrap; width: 48px; }
.a-rpt td { vertical-align: top; }
.a-tagact { display: inline-block; margin-top: 6px; background: #F5A623; color: #fff; border-radius: 5px; padding: 2px 8px; font-size: 12.5px; }
.a-photos.r3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 10px; padding: 8px 0; }
.a-rph { margin: 0; position: relative; background: var(--surface-sunken); padding: 5px; border-radius: 4px; }
.a-rph img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.a-rph .ts { position: absolute; right: 9px; bottom: 30px; background: #000; color: #fff; font: italic 11px var(--font-sans); padding: 1px 6px; }
.a-rph figcaption { text-align: center; font: italic 12px var(--font-sans); color: var(--text-muted); padding-top: 4px; }
/* ---------- sign in / sign up ---------- */
.a-auth { display: grid; grid-template-columns: minmax(0, 1fr); min-height: calc(100vh - 100px); }

@media (min-width: 900px) { .a-authbrand { padding: 56px 48px; align-content: center; } }
.a-authbrand .ld-logo { font-size: 40px; color: #fff; }
.a-authtag { justify-self: start; font: 700 11px/1 var(--font-label); letter-spacing: .16em; text-transform: uppercase; border: 1px solid rgba(255,255,255,.5); border-radius: 99px; padding: 6px 10px; }
.a-authbrand h2 { font: 400 clamp(26px, 3.2vw, 40px)/1.12 var(--font-display); letter-spacing: -0.02em; margin: 6px 0 4px; max-width: 16ch; }
.a-authbrand ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 15.5px; }
.a-authbrand li { display: flex; gap: 10px; align-items: flex-start; }
.a-authbrand li .ld-icon { flex: none; margin-top: 2px; color: var(--mint-300); }
.a-authbrand .a-fine { color: rgba(255,255,255,.75); margin-top: 8px; }
@media (max-width: 899px) { .a-authbrand ul, .a-authbrand .a-fine { display: none; } .a-authbrand h2 { font-size: 24px; } }
.a-authpanel { display: grid; place-items: start center; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 900px) { .a-authpanel { place-items: center; padding: 48px; } }
.a-authcard { width: min(440px, 100%); display: grid; gap: 14px; }
.a-authcard h1 { font: 400 clamp(28px, 3vw, 34px)/1.15 var(--font-display); letter-spacing: -0.02em; margin: 0; }
.a-authcard .a-form { gap: 16px; }
.a-authalt { text-align: center; font-size: 14.5px; color: var(--text-muted); margin: 4px 0 0; }
.a-linkbtn { border: 0; background: none; padding: 0; color: var(--brand-text); font: 600 14px var(--font-sans); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.a-linkbtn:focus-visible, .a-eye:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 4px; }
.a-eye { border: 0; background: none; color: var(--text-muted); cursor: pointer; display: grid; place-items: center; width: 32px; height: 32px; margin-right: -6px; border-radius: 8px; }
.a-eye[aria-pressed="true"] { color: var(--brand-text); }
.a-pwrules { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--text-muted); }
.a-pwrules li { display: inline-flex; gap: 4px; align-items: center; }
.a-pwrules li .ld-icon { opacity: .35; }
.a-pwrules li.ok { color: var(--success); } .a-pwrules li.ok .ld-icon { opacity: 1; }
.a-autherr { display: flex; gap: 8px; align-items: flex-start; margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--danger-subtle); color: var(--danger); font-size: 14px; font-weight: 600; }
.a-autherr .ld-icon { flex: none; margin-top: 2px; }
.a-authnote { border: 1px dashed var(--border-strong); border-radius: 14px; padding: 14px; display: grid; gap: 6px; font-size: 14px; }
.a-authnote p { margin: 0; color: var(--text-muted); }
.a-qr { display: grid; place-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px; min-height: 120px; }
.a-qr svg { width: 180px; height: 180px; }
.a-key { display: block; font: 600 15px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; background: var(--surface-sunken); border-radius: 10px; padding: 10px 12px; word-break: break-all; user-select: all; }
.a-signout { margin-left: 4px; }
@media (max-width: 760px) { .a-signout { padding: 0 8px; } }
.ld-check span > small, .ld-radio span > small { display: block; margin-top: 2px; }
/* ---------- settings ---------- */
.a-settings { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .a-settings { grid-template-columns: 230px minmax(0, 1fr); align-items: start; } }
.a-settabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
@media (min-width: 900px) { .a-settabs { display: grid; gap: 2px; position: sticky; top: 120px; overflow: visible; } }
.a-settab { display: inline-flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text-muted); font: 600 14px/1.2 var(--font-sans); cursor: pointer; white-space: nowrap; text-align: left; }
@media (min-width: 900px) { .a-settab { border-color: transparent; background: none; } }
.a-settab:hover { color: var(--text); background: var(--surface-sunken); }
.a-settab[aria-current="page"] { background: var(--brand-subtle); color: var(--brand-text); border-color: var(--brand-subtle); }
.a-settab:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.a-setbody { display: grid; gap: 16px; min-width: 0; max-width: 760px; }
.a-sethead h2 { font: 700 22px/1.25 var(--font-sans); margin: 0; letter-spacing: -0.01em; }
.a-sethead p { margin: 4px 0 0; color: var(--text-muted); }
.a-mfabox { display: grid; gap: 12px; border-top: 1px solid var(--border); padding-top: 14px; }
.a-mfabox p { margin: 0; color: var(--text-muted); }
.a-mfabox .a-qr { justify-self: start; }
button.a-who { border: 0; background: none; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
button.a-who:hover { background: var(--surface-sunken); }
button.a-who:focus-visible { outline: 2px solid var(--focus-ring); }
.ld-switch input:disabled + span.t { opacity: .6; }
.a-grid.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 640px) { .a-grid.k3 { grid-template-columns: minmax(0, 1fr); } }
.a-wqtabs { margin-bottom: 0; background: var(--surface); border: 1px solid var(--border); border-bottom: 0; border-radius: 14px 14px 0 0; padding: 0 8px; }
.a-wqtabs .ld-tab { gap: 8px; }
.a-wqtabs + [role=tabpanel] .a-tw { border-top-left-radius: 0; border-top-right-radius: 0; margin-top: 0; }
.a-wqempty { display: flex; gap: 10px; align-items: center; padding: 22px 18px; border: 1px solid var(--border); border-radius: 0 0 14px 14px; background: var(--surface); color: var(--text-muted); }
.a-wqempty .ld-icon { color: var(--success); }
.a-tw td.num { white-space: nowrap; }
/* Admin job tables: one line per cell, cut off with "…" */
.a-tw.a-clip table { table-layout: fixed; width: 100%; min-width: 980px; }
.a-tw.a-clip th, .a-tw.a-clip td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
.a-tw.a-clip td .clip { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-tw.a-clip td .clip > .ld-tag, .a-tw.a-clip td .clip > .ld-pill, .a-tw.a-clip td .clip > .ld-badge { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; box-sizing: border-box; }
.a-tw.a-clip td .clip > .ld-tag, .a-tw.a-clip td .clip > .ld-pill { line-height: 28px; }
.a-tw.a-clip td .clip > .ld-badge { line-height: 24px; }
.a-tw.a-clip td .clip > .ld-tag svg { vertical-align: -3px; margin-right: 6px; }
.a-tw.a-clip td .clip > .ld-pill i { display: inline-block; vertical-align: 0; margin-right: 6px; }
.a-tw.a-clip td .clip .a-fine { display: inline; }

/* Assignments calendar */
.a-cal { display: grid; gap: 12px; }
.a-cal-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.a-cal-nav { display: flex; align-items: center; gap: 8px; }
.a-cal-nav strong { font: 700 16px/24px var(--font-sans); min-width: 140px; text-align: center; }
.a-cal-grid { border: 1px solid var(--border); border-radius: var(--radius-lg, 12px); overflow: hidden; background: var(--surface); }
.a-cal-dow, .a-cal-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.a-cal-dow span { padding: 8px 10px; font: 600 12px/16px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); background: var(--surface-sunken); border-bottom: 1px solid var(--border); }
.a-cal-day { min-height: 112px; padding: 6px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); min-width: 0; }
.a-cal-day:nth-child(7n) { border-right: 0; }
.a-cal-days > .a-cal-day:nth-last-child(-n+7) { border-bottom: 0; }
.a-cal-day.out { background: var(--surface-sunken); }
.a-cal-day.out .a-cal-n { color: var(--text-muted); opacity: .6; }
.a-cal-n { font: 600 13px/22px var(--font-sans); padding: 0 4px; align-self: flex-start; border-radius: 999px; min-width: 22px; text-align: center; }
.a-cal-n em { display: none; font-style: normal; font-weight: 500; color: var(--text-muted); margin-left: 6px; }
.a-cal-day.today .a-cal-n { background: var(--brand); color: var(--on-brand); }
.a-cal-chip { display: block; width: 100%; text-align: left; border: 0; cursor: pointer; padding: 3px 6px 3px 8px; border-radius: 6px; background: var(--t); color: var(--tx); box-shadow: inset 3px 0 0 var(--c); font: 600 12px/18px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-cal-chip b { font-weight: 700; font-variant-numeric: tabular-nums; }
.a-cal-chip span { opacity: .75; font-weight: 500; }
.a-cal-chip.live { outline: 2px dashed var(--c); outline-offset: -2px; }
.a-cal-chip:hover { filter: brightness(.97); }
.a-cal-chip:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
.a-cal-more { font: 600 12px/18px var(--font-sans); color: var(--text-muted); padding: 0 6px; }
.a-cal-key { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 500 12.5px/18px var(--font-sans); color: var(--text-muted); }
.a-cal-key span { display: inline-flex; align-items: center; gap: 6px; }
.a-cal-key i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.a-cal-key i.live { background: transparent; outline: 2px dashed var(--text-muted); outline-offset: -2px; }
@media (max-width: 720px) {
  .a-cal-dow { display: none; }
  .a-cal-days { grid-template-columns: 1fr; }
  .a-cal-day { min-height: 0; border-right: 0; border-bottom: 1px solid var(--border) !important; padding: 10px; }
  .a-cal-day:not(.has) { display: none; }
  .a-cal-day .a-cal-n { padding: 0 8px; }
  .a-cal-n em { display: inline; color: inherit; opacity: .75; }
  .a-cal-chip { font-size: 13px; line-height: 22px; }
  .a-cal-days { min-height: 48px; }
}

/* Pros, levels & training */
.a-segtabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface-sunken); border: 1px solid var(--border); width: fit-content; max-width: 100%; }
.a-segtabs button { height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: var(--text-muted); font: 600 14px var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.a-segtabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-xs); }
.a-segtabs .cnt { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--warning-fill); color: var(--neutral-900); font: 700 12px/20px var(--font-sans); text-align: center; }
.a-lvchip { display: inline-block; min-width: 26px; height: 20px; padding: 0 5px; border-radius: 6px; background: var(--brand-subtle); color: var(--brand-text); font: 700 12px/20px var(--font-sans); text-align: center; margin-right: 4px; }
.a-req { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.a-req li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; }
.a-req li.ok svg { color: var(--success); }
.a-req li.no svg { color: var(--text-subtle); }
.a-req li.no span { color: var(--text-muted); }
.a-req em { font-style: normal; font-size: 13px; color: var(--text-muted); white-space: nowrap; }
.a-lvcard .a-next { border-top: 1px solid var(--border); padding-top: 14px; display: grid; gap: 10px; }
.a-lvcard h3, .a-next h3 { margin: 0; }
.a-ladder { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--surface); }
.a-ladder li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.a-ladder li:last-child { border-bottom: 0; }
.a-ladder .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--font-sans); background: var(--surface-sunken); color: var(--text-muted); }
.a-ladder li.insp .n { background: var(--service-checkin-subtle); color: var(--service-checkin-text); }
.a-ladder li.past .n { background: var(--brand-subtle); color: var(--brand-text); }
.a-ladder li.cur { background: var(--brand-subtle); }
.a-ladder li.cur .n { background: var(--brand); color: var(--on-brand); }
.a-ladder .t { display: grid; gap: 2px; min-width: 0; }
.a-ladder .t span { font-size: 13.5px; color: var(--text-muted); }
.a-ladder .pay { text-align: right; font: 700 16px var(--font-sans); display: grid; }
.a-ladder .pay small { font: 500 11.5px var(--font-sans); color: var(--text-muted); }
.a-tgroup { display: grid; gap: 8px; }
.a-tgroup h3 { font: 600 13px var(--font-sans); color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin: 4px 0 0; }
.a-trow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 18px; gap: 12px; align-items: center; width: 100%; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--border); background: none; text-align: left; cursor: pointer; color: var(--text); font: inherit; }
.a-trow:last-child { border-bottom: 0; }
.a-trow:hover { background: var(--surface-sunken); }
.a-trow .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--brand-subtle); color: var(--brand-text); }
.a-trow .t { display: grid; gap: 2px; min-width: 0; }
.a-trow .t b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-trow .t span { font-size: 13px; color: var(--text-muted); }
.a-player { width: 100%; max-height: 70vh; border-radius: 14px; background: #000; display: block; }
.a-pdfview { width: 100%; height: 70vh; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
.a-linkcard { grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; }
.a-linkcard p { overflow-wrap: anywhere; margin: 2px 0 0; }
.a-upfile { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-sunken); }
.a-upfile > span { display: grid; min-width: 0; }
.a-upfile b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-prohead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 16px; align-items: center; }
.a-prohead h1 { margin: 0 0 6px; }
.a-prohead .a-prostats { grid-column: 1 / -1; }
.a-pdgrid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); align-items: start; }
.a-card > h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0; }
.a-pdlevel { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.4fr) minmax(260px, 1fr); align-items: start; }
.a-pdlevel h4, .a-subcard h4 { margin: 12px 0 6px; font: 700 14px var(--font-sans); }
.a-subcard { border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: var(--surface-sunken); }
.a-subcard h4 { margin-top: 0; }
.a-app { display: grid; gap: 10px; padding: 14px 0; border-top: 1px solid var(--border); }
.a-app:first-of-type { border-top: 0; padding-top: 0; }
@media (max-width: 720px) { .a-pdlevel { grid-template-columns: 1fr; } .a-ladder .t span { font-size: 12.5px; } .a-trow { grid-template-columns: 36px minmax(0, 1fr) 18px; } .a-trow .ld-badge { display: none; } }
.a-tw td.nw { white-space: nowrap; }
.a-tw td.nw .ld-icon { vertical-align: -3px; }
.a-tlink { color: var(--text); text-decoration: none; }
.a-tlink:hover { text-decoration: underline; color: var(--link); }

/* notifications panel */
#notif-root { position: fixed; inset: 0; z-index: 300; pointer-events: none; }
#notif-root.open { pointer-events: auto; }
.a-ndim { position: absolute; inset: 0; background: var(--overlay); opacity: 0; transition: opacity .22s ease; }
#notif-root.open .a-ndim { opacity: .36; }
.a-npanel { position: absolute; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--surface-raised); box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; border-left: 1px solid var(--border); }
#notif-root.open .a-npanel { transform: none; }
.a-npanel-in { display: flex; flex-direction: column; min-height: 0; height: 100%; }
.a-npanel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 16px 14px 20px; border-bottom: 1px solid var(--border); }
.a-npanel-h h2 { font: 700 18px/24px var(--font-sans); margin: 0; }
.a-nlist { overflow-y: auto; flex: 1; overscroll-behavior: contain; }
.a-nlist .a-note-row i.r { background: transparent; }
.a-nempty { padding: 20px; }
.a-noscroll, .a-noscroll body { overflow: hidden; }
.a-bell[aria-expanded="true"] { background: var(--surface-sunken); }
@media (prefers-reduced-motion: reduce) { .a-npanel, .a-ndim { transition: none; } }
.a-pg tr.grp th { background: var(--surface-sunken); text-align: left; font: 700 13px var(--font-sans); letter-spacing: .02em; text-transform: none; color: var(--text); padding-top: 10px; padding-bottom: 10px; }
.a-pg tr.grp th .ld-icon { vertical-align: -3px; margin-right: 6px; color: var(--brand-text); }
.a-pg td.sub { padding-left: 34px; }
.a-tw.a-fit table { min-width: 0; }
.a-modal.wide { width: min(780px, 100%); }
.a-modal .a-subcard .a-kv { font-size: 14px; }
@media (min-width: 641px) { .a-choice.a-choice-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* sign-in image panel: photo with a translucent gradient card for legibility */
.a-authbrand { align-content: end; }
.a-authglass { position: relative; display: grid; gap: 14px; align-content: start; padding: 24px; border-radius: 20px; background: linear-gradient(160deg, rgba(4,37,38,.86) 0%, rgba(6,57,58,.72) 55%, rgba(8,92,93,.55) 100%); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 18px 48px -18px rgba(0,0,0,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
@media (min-width: 900px) { .a-authbrand { align-content: end; padding: 40px; } .a-authglass { padding: 32px; max-width: 520px; } }
@media (max-width: 899px) { .a-authbrand { min-height: 360px; background-position: 30% 20%; } .a-authglass { padding: 18px; gap: 10px; } }
.a-invite { display: grid; gap: 10px; padding: 14px 16px; border: 1px dashed var(--border-strong); border-radius: 12px; background: var(--surface-sunken); }
.a-invite > div { display: grid; gap: 2px; min-width: 0; }
.a-invite b.num { font: 700 22px/1.2 var(--font-sans); letter-spacing: .12em; }
.a-invite span.num { font-size: 13px; overflow-wrap: anywhere; }

/* users & roles */
.a-subh { font: 700 16px/22px var(--font-sans); margin: 0; }
.a-rolecard { gap: 6px; border-top: 3px solid var(--border-strong); }
.a-rolecard.r-main { border-top-color: var(--brand); }
.a-rolecard.r-sub { border-top-color: var(--service-checkin); }
.a-rolecard.r-ops { border-top-color: var(--service-cleaning); }
.a-rolecard p { margin: 0; }
.a-perm th.c, .a-perm td.c { text-align: center; width: 120px; }
.a-yes { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--success-subtle); color: var(--success); }
.a-no { color: var(--text-subtle); }
.ld-btn.a-danger { color: var(--danger); }
@media (max-width: 640px) { .a-roles3 { grid-template-columns: 1fr; } }
select.a-mini[data-staffrole] { min-width: 150px; }

body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
</style>
</head>

var LEVEL_INFO = [null,
  { name: 'Cleaner', unlocks: 'Light cleans' },
  { name: 'Experienced cleaner', unlocks: 'Light and General cleans' },

/* price guide used by Admin to prefill quote lines — not shown to clients as a price */
function guideLines(j) {

  else L.push({ d: 'Labour: ' + (j.scope.category || 'repair'), q: 1, u: 0 }, { d: 'Materials', q: 1, u: 0 });

/* ---------- Pro invitations ---------- */
/* Admin adds a Pro with first name + email. LISTD makes a one-time code (only its SHA-256 hash is stored)
   and a link. The Pro opens the link, confirms the code and their email, creates a password, then onboards.
   No email service is connected yet, so the Admin sends the invitation from their own email app. */

function inviteLink(code) { var base = ENV.mode === 'db' ? APP_URL : String(location.href).split('#')[0]; return base + '#invite=' + code; }
function inviteOpen(p) { return p && p.status === 'INVITED' && p.invite && !p.invite.acceptedAt && hoursFrom(p.invite.expiresAt) > 0; }

  var first = p.firstName || p.name || 'there', link = inviteLink(code), exp = fdate(p.invite.expiresAt);
  var body = 'Hi ' + first + ',\n\nYou’ve been invited to join LISTD as a Pro.\n\n1. Open this link: ' + link + '\n2. Choose Pro, then "Accept an invitation".\n3. Enter your code ' + code + ' and this email address (' + p.email + '), then create your password.\n\nYou’ll then add your details, skills, area and documents so LISTD can approve you for work.\n\nThis invitation expires on ' + exp + '.\n\nThe LISTD team';
  return 'mailto:' + encodeURIComponent(p.email) + '?subject=' + encodeURIComponent('You’re invited to join LISTD as a Pro') + '&body=' + encodeURIComponent(body);
}
async function cmdInvitePro(first, email) {
  first = String(first || '').trim(); email = normEmail(email);
  if (!first) return deny('Enter the Pro’s first name.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return deny('Enter a valid email address.');

}
